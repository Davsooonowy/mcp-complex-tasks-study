[project]
name = "mcp-complex-tasks-study"
version = "0.1.0"
description = "Badanie możliwości wykonywania złożonych zadań z wykorzystaniem agentów AI i protokołu MCP"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "smolagents[mcp,openai]>=1.24.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["vulnerability_agent/tests"]
